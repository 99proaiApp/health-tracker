<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ย้ายข้อมูลเก่าเข้า Firestore</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0f19;
    color: #f1f5f9;
    padding: 24px 16px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
  }
  h1{ font-size: 1.2rem; margin-bottom: 8px; }
  p{ color: #94a3b8; font-size: 0.9rem; }
  .card{
    background: rgba(23,31,51,0.65);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 18px;
    margin: 16px 0;
  }
  .count{ font-size: 2rem; font-weight: 700; color: #38bdf8; }
  button{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #8b5cf6;
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  #log{
    margin-top: 16px;
    font-size: 0.82rem;
    color: #94a3b8;
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .ok{ color: #4ade80; }
  .err{ color: #f87171; }
</style>
</head>
<body>
  <h1>🔄 ย้ายข้อมูลเก่าเข้า Firestore</h1>
  <p>เปิดหน้านี้จากเบราว์เซอร์/เครื่องเดียวกับที่เคยบันทึกข้อมูลไว้ก่อนอัปเดตเป็นเวอร์ชันออนไลน์ กดปุ่มด้านล่างเพื่อคัดลอกข้อมูลเก่าขึ้น Firestore (ไม่ลบข้อมูลเดิมในเครื่อง)</p>

  <div class="card">
    <div>พบข้อมูลเก่าในเครื่องนี้</div>
    <div class="count" id="foundCount">กำลังตรวจสอบ...</div>
  </div>

  <button id="migrateBtn" disabled>ย้ายข้อมูลเข้า Firestore</button>
  <div id="log"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA0DBx6-AfhIhzTHUs85PnbKisut5nqrM8",
    authDomain: "health-tracker-964bd.firebaseapp.com",
    projectId: "health-tracker-964bd",
    storageBucket: "health-tracker-964bd.firebasestorage.app",
    messagingSenderId: "381325774882",
    appId: "1:381325774882:web:06c30bb528c75456a3ba7b"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const logsCollection = db.collection('healthLogs');

  const logEl = document.getElementById('log');
  const foundCountEl = document.getElementById('foundCount');
  const migrateBtn = document.getElementById('migrateBtn');

  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // อ่านข้อมูลเก่าจาก localStorage (คีย์เดิมที่แอปรุ่นก่อนใช้)
  let oldLogs = [];
  try {
    oldLogs = JSON.parse(localStorage.getItem('glass_health_logs')) || [];
  } catch (e) {
    oldLogs = [];
  }

  foundCountEl.textContent = oldLogs.length + ' รายการ';

  if (oldLogs.length === 0) {
    log('ไม่พบข้อมูลเก่าในเบราว์เซอร์นี้ — อาจจะเปิดผิดเครื่อง/เบราว์เซอร์ที่เคยบันทึกไว้ หรือย้ายไปแล้วก่อนหน้านี้', 'err');
  } else {
    migrateBtn.disabled = false;
  }

  migrateBtn.addEventListener('click', async () => {
    migrateBtn.disabled = true;
    log('กำลังล็อกอิน...');

    try {
      await auth.signInAnonymously();
    } catch (e) {
      log('ล็อกอินไม่สำเร็จ: ' + e.message, 'err');
      migrateBtn.disabled = false;
      return;
    }

    log('เริ่มย้ายข้อมูล ' + oldLogs.length + ' รายการ...');
    let success = 0, failed = 0;

    for (const item of oldLogs) {
      try {
        const entry = {
          timestamp: item.timestamp || new Date(item.id || Date.now()).toISOString(),
          dateKey: (item.timestamp ? new Date(item.timestamp) : new Date(item.id || Date.now())).toISOString().slice(0, 10),
          dateOnly: item.dateOnly || '',
          timeOnly: item.timeOnly || '',
          type: item.type || 'note',
          symptoms: item.symptoms || [],
          topic: item.topic || '',
          note: item.note || '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          migratedFromLocal: true
        };
        await logsCollection.add(entry);
        success++;
        log('✓ ย้ายแล้ว: ' + (entry.dateOnly || entry.dateKey) + ' ' + entry.timeOnly + ' (' + entry.type + ')', 'ok');
      } catch (e) {
        failed++;
        log('✗ ล้มเหลว 1 รายการ: ' + e.message, 'err');
      }
    }

    log('เสร็จสิ้น: สำเร็จ ' + success + ' รายการ, ล้มเหลว ' + failed + ' รายการ', success > 0 ? 'ok' : 'err');
    log('ข้อมูลเดิมในเครื่องนี้ยังอยู่ครบ ไม่ได้ถูกลบ — ตรวจสอบในแอปหลักว่าครบแล้วค่อยลบเองได้ภายหลังถ้าต้องการ');
  });
</script>
</body>
</html>
